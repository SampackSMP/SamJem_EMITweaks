## Dependency versions
# EMI has no normal Maven repository - Modrinth's maven-compatible endpoint is used instead,
# keyed by Modrinth's own opaque per-file version id (from `GET /v2/project/emi/version`), not
# EMI's own "1.1.24+1.21.1" version string. This id is EMI 1.1.24 for NeoForge 1.21.1, dated
# 2026-05-13. Re-resolve via the Modrinth API if EMI needs to be bumped.
emi_version=5sIPA1To
# REMI (Reliable EMI), whose stack groups the creative inventory uses (compile-only). Modrinth's
# per-file version id for remi-neoforge-1.21.1-4.7.1.jar, as with emi_version.
remi_version=efcTy7zE
mixinextras_version=0.5.0
# Optional config-screen backends for the inventory item groups (compile-only).
simple_config_lib_version=2.1-neoforge+1.21.1
cloth_config_version=15.0.140
