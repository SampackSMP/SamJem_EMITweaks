modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
SamPack EMI reload and load-time fixes:
- EMI sorts tags by their cached member lists instead of re-walking the
  registry on every comparison.
- EMI resolves shaped/shapeless crafting remainders per item instead of
  simulating a crafting grid per candidate, when the recipe uses vanilla's
  default remainder logic.
- EMI's missing-item-id exceptions skip their discarded stack traces.
- Duplicate creative-tab entries are ignored instead of aborting the tab build.
- ComputerCraft skips its redundant server-start tab rebuild in singleplayer.
- Enhanced Tooltips reuses vanilla's creative-tab build instead of its own.
- EMI Trades no longer uses the client level's random off-thread.
- Sable applies block physics properties once per reload, not once per level,
  and skips the redundant client-side copy in singleplayer.
- Puzzles Lib builds its model location set once per session, in parallel,
  instead of once per model handler.
- owo-lib skips its per-ItemStack component derivation when it is a no-op.
- Farmer's Delight item-ability ingredients share one registry scan per
  ability instead of one per recipe.
- EMIffect and REMI skip registry entries and stack groups that cannot match
  during EMI's reload.
- REMI's built-in default stack groups are not loaded; the pack's own groups
  in config/remi/stack_groups/ still are.
- BCLib anvil recipes list hammers from the hammer tag instead of scanning
  every item.
- EMI's index is built from the creative tabs as their mods made them, in
  registry order, not as the pack's tab rules arrange them.
- Keeps a copy of EMI's index from before resource-pack index data is applied,
  for tools that dump it (SamJem: IconDump).

Also adds collapsible item groups to the creative inventory (from Inventory
Item Groups by Bizarre Cube, MIT). Configure them with Simple Config Lib or
Cloth Config.

Adds, hides and orders creative tabs from
config/sampack_emitweaks/creative_tabs.json (written by InvIndexLedger), in
place of Recreative.

The creative inventory can be made wider and taller (more item columns and
rows, and more tabs per row) in the client config.
'''

[[mixins]]
config = "sampack_emitweaks.mixins.json"

[[mixins]]
config = "sampack_emitweaks.compat.mixins.json"

[[mixins]]
config = "sampack_emitweaks.emi.mixins.json"

[[mixins]]
config = "sampack_emitweaks.itemgroups.mixins.json"

[[mixins]]
config = "sampack_emitweaks.creative.mixins.json"

[[mixins]]
config = "sampack_emitweaks.pristine.mixins.json"

[[mixins]]
config = "sampack_emitweaks.tabs.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The EMI mixins target EMI's own classes directly; they are skipped when EMI
# is absent (e.g. on a dedicated server).
[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
versionRange = "[1.1.24,)"
ordering = "AFTER"
side = "CLIENT"

# Config screen backends for the inventory item groups; either one works.
[[dependencies.${mod_id}]]
modId = "simple_config_lib"
type = "optional"
versionRange = "[2.1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "cloth_config"
type = "optional"
versionRange = "[15,)"
ordering = "NONE"
side = "CLIENT"

# Replaced by the inventory item groups built into this mod.
[[dependencies.${mod_id}]]
modId = "inventory_item_groups"
type = "incompatible"
reason = "SamPack EMI Tweaks already includes Inventory Item Groups. Remove the separate jar."
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"

# Replaced by the creative tab rules built into this mod; both would apply.
[[dependencies.${mod_id}]]
modId = "recreative"
type = "incompatible"
reason = "SamPack EMI Tweaks now applies the pack's creative tabs itself (config/sampack_emitweaks/creative_tabs.json). Remove Recreative."
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"
